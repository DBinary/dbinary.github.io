- id: ai-agents
  title: AI and Agents for Life Sciences
  description: >-
    I develop AI methods for analyzing biological data and studying human health. My work
    includes meta-learning for disease diagnosis and prediction from plasma proteomics, and
    tools for bulk and single-cell omics analysis. I am interested in combining biological
    knowledge with machine learning to improve interpretability and adaptation to new research
    questions.
  description_details: >-
    Another focus is the infrastructure that enables AI agents to use biological analysis
    tools. OmicVerse provides reusable omics methods, while OmicOS connects this infrastructure
    with an agent system. Across these projects, I explore how analytical capabilities and
    agent-assisted workflows can make computational research easier to inspect and extend.
  image: /images/omicos.png
  image_alt: Overview of the OmicOS omics ecosystem infrastructure and agent system
  image_width: 1407
